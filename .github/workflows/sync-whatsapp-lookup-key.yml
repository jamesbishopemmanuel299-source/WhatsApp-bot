name: Sync WhatsApp lookup key to Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-lookup-key:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required GitHub secrets
        shell: bash
        env:
          LOOKUP_KEY: ${{ secrets.WHATSAPP_LOOKUP_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          [[ -n "$LOOKUP_KEY" ]] || { echo "::error::Missing GitHub secret WHATSAPP_LOOKUP_KEY"; exit 1; }
          [[ -n "$RENDER_API_KEY" ]] || { echo "::error::Missing GitHub secret RENDER_API_KEY"; exit 1; }
          [[ -n "$RENDER_SERVICE_ID" ]] || { echo "::error::Missing GitHub secret RENDER_SERVICE_ID"; exit 1; }

      - name: Write lookup key to the selected Render service
        shell: bash
        env:
          LOOKUP_KEY: ${{ secrets.WHATSAPP_LOOKUP_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg value "$LOOKUP_KEY" '{value: $value}')"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/WHATSAPP_LOOKUP_KEY" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            --output /dev/null
          echo "Render accepted the lookup-key update."

      - name: Verify the variable exists on that Render service
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars?limit=100" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json")"
          if ! jq -e 'any(.[]; .envVar.key == "WHATSAPP_LOOKUP_KEY")' <<< "$response" >/dev/null; then
            echo "::error::Render did not return WHATSAPP_LOOKUP_KEY for this service. Check RENDER_SERVICE_ID and whether the variable is managed by an environment group."
            exit 1
          fi
          echo "Verified: WHATSAPP_LOOKUP_KEY exists on the selected Render service. Value was not printed."

      - name: Trigger Render deployment
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"deployMode":"build_and_deploy"}' \
            --output /dev/null
          echo "Render deployment request accepted."
