services:
  - type: web
    name: emzaro-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: DEMO_ONLY
        value: "true"
      - key: ENABLE_LIVE_TRADING
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: WHATSAPP_LOOKUP_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DERIV_ACCESS_TOKEN
        sync: false
      - key: DERIV_ACCOUNT_ID
        sync: false
      - key: DERIV_APP_ID
        sync: false
